<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fork'd — your cooking journal</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #F4F0E6;
      color: #1E3A2B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: -1.5px;
      margin: 0 0 16px;
    }
    p {
      font-size: 16px;
      color: rgba(30, 58, 43, 0.65);
      max-width: 320px;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      background: #1E3A2B;
      color: #F4F0E6;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div>
    <h1>Fork'd</h1>
    <p>Your private cooking journal.<br />Snap, save, remember.</p>
    <a href="https://apps.apple.com/app/id6767834305">Get the app</a>
  </div>
</body>
</html>
